<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Next Ball</title>
<meta name="description" content="Find your groove. Fast golf shot logging for driving-range practice." />

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0b0d10" />

<!-- iOS installability -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Next Ball" />

<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/style.css" />
<script>
  (function () {
    try {
      var raw = localStorage.getItem('rangelog_db_v1');
      var pref = raw ? (JSON.parse(raw).settings || {}).theme : null;
      var resolved = pref === 'light' || pref === 'dark'
        ? pref
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', resolved);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>
</head>
<body>
<div id="app" role="main"></div>
<div id="toast" class="toast" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
